[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-deliberate-mcp"
version = "0.1.0"
description = "MCP server for multi-LLM deliberation with anonymized peer review"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LLM Council Contributors"},
]
keywords = ["mcp", "llm", "deliberation", "council", "peer-review", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.2.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[project.scripts]
llm-deliberate-mcp = "llm_council_mcp:main"

[project.urls]
Homepage = "https://github.com/haza/llm-council"
Repository = "https://github.com/haza/llm-council"
Issues = "https://github.com/haza/llm-council/issues"

[tool.hatch.build.targets.sdist]
include = ["src/llm_council_mcp"]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_council_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
